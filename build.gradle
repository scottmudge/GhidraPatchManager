plugins {
    id 'java'
}

group = 'com.ghidrapatchmanager'
version = '1.3.4'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

def ghidraInstallDir = providers.gradleProperty('GHIDRA_INSTALL_DIR')
    .orElse(providers.environmentVariable('GHIDRA_INSTALL_DIR'))
    .orNull

if (ghidraInstallDir) {
    apply from: "${ghidraInstallDir}/support/buildExtension.gradle"

    tasks.named("buildExtension") {
        exclude "build.ps1"
        exclude "build.sh"
        exclude "build_custom.sh"
        exclude "CHANGELOG.md"
        exclude "gradle.properties"
        exclude "settings.gradle"
        exclude ".gitignore"

        // Exclude GitHub workflows and other .github contents
        exclude ".github/**"

        // Ghidra's buildExtension task normally bundles the source ZIP.
        exclude "**/*-src*.zip"
    }
} else {
    tasks.register('buildExtension') {
        group = 'ghidra'
        doLast {
            throw new GradleException('Set GHIDRA_INSTALL_DIR to your Ghidra installation directory.')
        }
    }
}
