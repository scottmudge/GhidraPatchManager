name: Build Ghidra Patch Manager Extension

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Download latest Ghidra release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Find the latest release's zip asset via the GitHub API
        URL=$(curl -sSf -H "Authorization: Bearer $GH_TOKEN" \
          https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest \
          | jq -r '.assets[] | select(.name | test("^ghidra_.*_PUBLIC_.*\\.zip$")) | .browser_download_url' \
          | head -n 1)
        echo "Downloading $URL"
        curl -sSfL -o "$RUNNER_TEMP/ghidra.zip" "$URL"

        # Extract and point GHIDRA_INSTALL_DIR at the top-level folder inside the zip
        mkdir -p "$RUNNER_TEMP/ghidra"
        unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
        GHIDRA_DIR=$(find "$RUNNER_TEMP/ghidra" -mindepth 1 -maxdepth 1 -type d | head -n 1)
        echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
        echo "Ghidra installed at $GHIDRA_DIR"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: current   # remove this line if your repo has a Gradle wrapper

    - name: Build extension
      run: gradle buildExtension   # or: ./gradlew buildExtension

    - name: Upload extension zip
      uses: actions/upload-artifact@v4
      with:
        name: GhidraPatchManager
        path: dist/*.zip
        if-no-files-found: error
